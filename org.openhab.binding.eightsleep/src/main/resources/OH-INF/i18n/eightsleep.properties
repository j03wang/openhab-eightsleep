# add-on

addon.eightsleep.name = Eight Sleep Binding
addon.eightsleep.description = The Eight Sleep binding integrates Eight Sleep smart mattress covers (Pod) via the Eight Sleep cloud API. It exposes sleep tracking metrics, bed temperature control, adjustable base control and alarms for each side of the bed.

# thing types

thing-type.eightsleep.account.label = Eight Sleep Account
thing-type.eightsleep.account.description = An Eight Sleep cloud account. Each account bridge handles one Eight Sleep login and polls the Eight Sleep cloud API for device and sleep data.

thing-type.eightsleep.bedSide.label = Bed Side
thing-type.eightsleep.bedSide.description = A single side of an Eight Sleep smart mattress: sleep metrics, temperature control, base control and alarms of one sleeper.

# bridge config

thing-type.config.eightsleep.account.username.label = Username
thing-type.config.eightsleep.account.username.description = The e-mail address of your Eight Sleep account.
thing-type.config.eightsleep.account.password.label = Password
thing-type.config.eightsleep.account.password.description = The password of your Eight Sleep account.
thing-type.config.eightsleep.account.clientId.label = Client ID
thing-type.config.eightsleep.account.clientId.description = Optional OAuth client id override. Leave empty to use the client id of the official mobile app.
thing-type.config.eightsleep.account.clientSecret.label = Client Secret
thing-type.config.eightsleep.account.clientSecret.description = Optional OAuth client secret override. Leave empty to use the client secret of the official mobile app.
thing-type.config.eightsleep.account.deviceRefreshInterval.label = Device Refresh Interval
thing-type.config.eightsleep.account.deviceRefreshInterval.description = Polling interval in seconds for device state (heating levels, water, presence).
thing-type.config.eightsleep.account.userRefreshInterval.label = User Data Refresh Interval
thing-type.config.eightsleep.account.userRefreshInterval.description = Polling interval in seconds for sleep data (trends, alarms).
thing-type.config.eightsleep.account.baseRefreshInterval.label = Base Data Refresh Interval
thing-type.config.eightsleep.account.baseRefreshInterval.description = Polling interval in seconds for adjustable base data (angles, presets).
thing-type.config.eightsleep.account.temperatureUnit.label = Temperature Unit
thing-type.config.eightsleep.account.temperatureUnit.description = Unit used to interpret plain number commands for temperatures. Leave empty to use Celsius. Quantity commands always carry their own unit.
thing-type.config.eightsleep.account.temperatureUnit.option.C = Celsius
thing-type.config.eightsleep.account.temperatureUnit.option.F = Fahrenheit
thing-type.config.eightsleep.account.deviceId.label = Device ID
thing-type.config.eightsleep.account.deviceId.description = The Eight Sleep device (pod) to bind. Leave empty to use the first device of the account; set it when your account has more than one pod. Discovered devices are listed in the thing properties.

# bed side config

thing-type.config.eightsleep.bedSide.userId.label = User ID
thing-type.config.eightsleep.bedSide.userId.description = The Eight Sleep user id of the sleeper on this bed side. Populated automatically by discovery.
thing-type.config.eightsleep.bedSide.label.label = Side
thing-type.config.eightsleep.bedSide.label.description = The physical side this user sleeps on.
thing-type.config.eightsleep.bedSide.label.option.left = Left
thing-type.config.eightsleep.bedSide.label.option.right = Right
thing-type.config.eightsleep.bedSide.label.option.solo = Both (solo)

# channel group types

channel-group-type.eightsleep.currentSleep.label = Current Sleep
channel-group-type.eightsleep.currentSleep.description = Data of the current or most recent sleep session.
channel-group-type.eightsleep.lastSleep.label = Last Sleep
channel-group-type.eightsleep.lastSleep.description = Summary of the last completed sleep session.
channel-group-type.eightsleep.deviceState.label = Device State
channel-group-type.eightsleep.deviceState.description = Live device level data for this side of the mattress cover.
channel-group-type.eightsleep.baseControl.label = Adjustable Base
channel-group-type.eightsleep.baseControl.description = Controls and sensors of an optional Eight Sleep adjustable base. Only available when a base is paired with the bed.

# channel types

channel-type.eightsleep.bedTemperature.label = Bed Temperature
channel-type.eightsleep.bedTemperature.description = Current temperature measured at the mattress surface of this side.
channel-type.eightsleep.targetTemperature.label = Target Temperature
channel-type.eightsleep.targetTemperature.description = Target bed temperature. Set it to heat or cool this side. The valid range corresponds to the raw heating level range -100 to 100 of the Eight Sleep API.
channel-type.eightsleep.roomTemperature.label = Room Temperature
channel-type.eightsleep.roomTemperature.description = Ambient room temperature measured by the mattress cover.
channel-type.eightsleep.heartRate.label = Heart Rate
channel-type.eightsleep.heartRate.description = Current heart rate in beats per minute.
channel-type.eightsleep.respiratoryRate.label = Respiratory Rate
channel-type.eightsleep.respiratoryRate.description = Current respiratory rate in breaths per minute.
channel-type.eightsleep.hrv.label = Heart Rate Variability
channel-type.eightsleep.hrv.description = Current heart rate variability.
channel-type.eightsleep.breathRate.label = Breath Rate
channel-type.eightsleep.breathRate.description = Breathing rate reported by the sleep tracking.
channel-type.eightsleep.sleepScore.label = Sleep Score
channel-type.eightsleep.sleepScore.description = Overall sleep score as computed by the Eight Sleep cloud.
channel-type.eightsleep.qualityScore.label = Sleep Quality Score
channel-type.eightsleep.qualityScore.description = Sleep quality score as computed by the Eight Sleep cloud.
channel-type.eightsleep.routineScore.label = Sleep Routine Score
channel-type.eightsleep.routineScore.description = Sleep routine score as computed by the Eight Sleep cloud.
channel-type.eightsleep.timeSlept.label = Time Slept
channel-type.eightsleep.timeSlept.description = Total duration of the last sleep session.
channel-type.eightsleep.lightSleepDuration.label = Light Sleep Duration
channel-type.eightsleep.lightSleepDuration.description = Time spent in light sleep during the last session.
channel-type.eightsleep.deepSleepDuration.label = Deep Sleep Duration
channel-type.eightsleep.deepSleepDuration.description = Time spent in deep sleep during the last session.
channel-type.eightsleep.remSleepDuration.label = REM Sleep Duration
channel-type.eightsleep.remSleepDuration.description = Time spent in REM sleep during the last session.
channel-type.eightsleep.awakeDuration.label = Awake Duration
channel-type.eightsleep.awakeDuration.description = Time spent awake during the last session.
channel-type.eightsleep.sleepStage.label = Sleep Stage
channel-type.eightsleep.sleepStage.description = Current sleep stage (awake, light, deep, rem) derived from the session's stage segments; "unknown" while no stage data is available.
channel-type.eightsleep.sleepStage.state.option.awake = Awake
channel-type.eightsleep.sleepStage.state.option.light = Light
channel-type.eightsleep.sleepStage.state.option.deep = Deep
channel-type.eightsleep.sleepStage.state.option.rem = REM
channel-type.eightsleep.sleepStage.state.option.unknown = Unknown
channel-type.eightsleep.tossesTurns.label = Tosses and Turns
channel-type.eightsleep.tossesTurns.description = Number of tosses and turns during the last session.
channel-type.eightsleep.sessionStart.label = Session Start
channel-type.eightsleep.sessionStart.description = Date and time when the current sleep session started.
channel-type.eightsleep.sessionEnd.label = Session End
channel-type.eightsleep.sessionEnd.description = Date and time when the sleep session ended.
channel-type.eightsleep.nextAlarm.label = Next Alarm
channel-type.eightsleep.nextAlarm.description = Date and time of the next scheduled alarm.
channel-type.eightsleep.alarmEnabled.label = Alarm Enabled
channel-type.eightsleep.alarmEnabled.description = Enable or disable the next scheduled alarm.
channel-type.eightsleep.alarmTime.label = Alarm Time
channel-type.eightsleep.alarmTime.description = Time of day of the next scheduled alarm. Command a DateTime to reschedule it.
channel-type.eightsleep.dismissAlarm.label = Dismiss Alarm
channel-type.eightsleep.dismissAlarm.description = Trigger to dismiss/stop the currently ringing or next alarm.
channel-type.eightsleep.snoozeAlarm.label = Snooze Alarm
channel-type.eightsleep.snoozeAlarm.description = Trigger to snooze the currently ringing alarm for the configured snooze minutes.
channel-type.eightsleep.heatingLevel.label = Heating Level
channel-type.eightsleep.heatingLevel.description = Raw heating/cooling level as used by the Eight Sleep API (-100 to 100).
channel-type.eightsleep.heatingState.label = Heating State
channel-type.eightsleep.heatingState.description = Whether this side is currently heating, cooling or idle.
channel-type.eightsleep.heatingState.state.option.heating = Heating
channel-type.eightsleep.heatingState.state.option.cooling = Cooling
channel-type.eightsleep.heatingState.state.option.idle = Idle
channel-type.eightsleep.heatingRemainingTime.label = Heating Time Remaining
channel-type.eightsleep.heatingRemainingTime.description = Remaining time of the current heating/cooling period.
channel-type.eightsleep.sidePower.label = Side Power
channel-type.eightsleep.sidePower.description = Turn this side of the bed on (smart mode) or off.
channel-type.eightsleep.basePreset.label = Base Preset
channel-type.eightsleep.basePreset.description = Preset position of the adjustable base.
channel-type.eightsleep.basePreset.state.option.sleep = Sleep
channel-type.eightsleep.basePreset.state.option.relaxing = Relaxing
channel-type.eightsleep.basePreset.state.option.reading = Reading
channel-type.eightsleep.headAngle.label = Head Angle
channel-type.eightsleep.headAngle.description = Angle of the head/torso section of the adjustable base (0-45 degrees).
channel-type.eightsleep.feetAngle.label = Feet Angle
channel-type.eightsleep.feetAngle.description = Angle of the feet/leg section of the adjustable base (0-20 degrees).
channel-type.eightsleep.snoreMitigation.label = Snore Mitigation
channel-type.eightsleep.snoreMitigation.description = ON while snore mitigation is actively raising the head section.
channel-type.eightsleep.bedPresence.label = Bed Presence
channel-type.eightsleep.bedPresence.description = ON when someone is present on this side of the bed.
channel-type.eightsleep.ledBrightness.label = LED Brightness
channel-type.eightsleep.ledBrightness.description = Brightness of the hub LED (0-100).
channel-type.eightsleep.hasWater.label = Has Water
channel-type.eightsleep.hasWater.description = ON when the water reservoir has water. OFF means you need to refill.
channel-type.eightsleep.needsPriming.label = Needs Priming
channel-type.eightsleep.needsPriming.description = ON when the device reports it needs priming.
channel-type.eightsleep.isPriming.label = Priming In Progress
channel-type.eightsleep.isPriming.description = ON while a priming run is in progress.
channel-type.eightsleep.lastPrime.label = Last Prime
channel-type.eightsleep.lastPrime.description = Date and time of the last completed priming.
channel-type.eightsleep.awayMode.label = Away Mode
channel-type.eightsleep.awayMode.description = ON while this user is in away mode. Turn it on/off to start or end away mode. The state is UNDEF until the first away-status poll, then reflects what the API reports, so it also flips when away mode is changed in the Eight Sleep app.
channel-type.eightsleep.primeTrigger.label = Start Priming
channel-type.eightsleep.primeTrigger.description = Send ON to start the pod priming procedure. This user receives the completion notification. Check isPriming for progress.

channel-group-type.eightsleep.pillowControl.label = Pillow
channel-group-type.eightsleep.pillowControl.description = The Pod 5 pillow, which heats and cools independently of the pod. Only populated when a pillow is reported for this bed side.

# thing status

account.status.missing-credentials = Username and password must be set in the account configuration
account.status.no-devices = No Eight Sleep devices found for this account
account.status.auth-expired = Authentication failed; check your credentials
bedside.status.missing-user = The userId parameter is required; run discovery or set it manually
bedside.status.duplicate-user = Another bed side thing is already configured with this userId; each user can only have one bed side
bedside.status.stale-data = Polling has been failing; the shown values are cached and may be outdated
bedside.status.user-not-found = No data is being polled for this userId; verify the userId configuration and run discovery again
